services:
  - type: web
    runtime: node
    name: torcly-api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @torcly/api build
    startCommand: pnpm --filter @torcly/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

  - type: web
    runtime: static
    name: torcly-web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @torcly/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ENABLE_DEMO
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
